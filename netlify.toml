[build]
  publish = "multistate-dmv-portal/public"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "multistate-dmv-portal/netlify/functions"
  node_bundler = "esbuild"
  included_files = ["multistate-dmv-portal/templates/**", "templates/**"]

[[redirects]]
  from = "/billing/success"
  to = "/billing/success.html"
  status = 200

[[redirects]]
  from = "/billing/cancel"
  to = "/billing/cancel.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
